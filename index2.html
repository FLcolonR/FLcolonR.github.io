<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap">
<style>
  html { color-scheme: light; }
  body { margin: 0; }
  [hidden] { display: none !important; }
  /* Layout: brand statement on the left, account card (sign in / create account tabs) on the right; stacks on phones. After sign-in a plain members page replaces both. */
  :root {
    --bg: #eef1f5;
    --surface: #fbfcfd;
    --fg: #131a24;
    --muted: #5a6678;
    --line: #d3d9e2;
    --accent: #0b6e6e;
    --accent-fg: #ffffff;
    --danger: #b3261e;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e131a; --surface: #151c26; --fg: #e6ebf2; --muted: #93a0b3;
      --line: #263040; --accent: #3ec9b8; --accent-fg: #06201d; --danger: #ff8a80;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e131a; --surface: #151c26; --fg: #e6ebf2; --muted: #93a0b3;
    --line: #263040; --accent: #3ec9b8; --accent-fg: #06201d; --danger: #ff8a80;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.55;
    padding-block: 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1, h2 { font-family: var(--font-display); text-wrap: balance; line-height: 1.1; margin: 0; }
  p { margin: 0; }
  .mono, .eyebrow { font-family: var(--font-mono); }
  .eyebrow { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

  /* Account screen */
  .gate {
    max-width: 960px;
    margin-inline: auto;
    min-height: 70vh;
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    gap: clamp(32px, 6vw, 80px);
    align-items: center;
  }
  .gate h1 { font-size: clamp(44px, 8vw, 84px); font-weight: 700; letter-spacing: -0.02em; margin-top: 14px; }
  .gate .sub { color: var(--muted); margin-top: 18px; max-width: 34ch; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 28px 28px;
    min-width: 0;
  }
  .tabs { display: flex; border-bottom: 1px solid var(--line); margin-inline: -28px; padding-inline: 16px; }
  .tab {
    font: inherit; font-weight: 600; font-size: 16px;
    background: none; border: 0; border-bottom: 2px solid transparent;
    color: var(--muted); padding: 14px 12px 12px; margin-bottom: -1px; cursor: pointer;
  }
  .tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  form { display: grid; gap: 18px; margin-top: 24px; }
  label { display: grid; gap: 6px; font-size: 13px; font-family: var(--font-mono); letter-spacing: 0.04em; color: var(--muted); }
  input {
    font: inherit;
    font-family: var(--font-body);
    font-size: 17px;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 11px 12px;
    width: 100%;
    min-width: 0;
  }
  input:focus-visible, .btn:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { font-size: 14px; color: var(--muted); font-family: var(--font-body); letter-spacing: 0; }
  .btn {
    font: inherit;
    font-weight: 600;
    background: var(--accent);
    color: var(--accent-fg);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 12px 18px;
    cursor: pointer;
  }
  .btn[disabled] { opacity: 0.55; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); padding: 8px 14px; font-size: 15px; }
  .error { min-height: 1.4em; color: var(--danger); font-size: 15px; }
  .note { font-size: 15px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; margin-top: 20px; }

  /* Members page */
  .app-head {
    max-width: 960px; margin: 0 auto 56px;
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    border-bottom: 1px solid var(--line); padding-bottom: 16px;
  }
  .brand-mini { font-family: var(--font-display); font-weight: 700; font-size: 20px; display: flex; align-items: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .inside { max-width: 960px; margin-inline: auto; }
  .inside h1 { font-size: clamp(40px, 7vw, 68px); margin-top: 12px; }
  .lede { color: var(--muted); margin-top: 16px; max-width: 52ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 40px; }
  .tile { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 22px; min-width: 0; }
  .tile h2 { font-size: 20px; font-weight: 500; margin-bottom: 10px; }
  .tile ul { margin: 0; padding-left: 18px; }
  .tile .mono { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }

  .admin { max-width: 960px; margin: 56px auto 0; border-top: 1px solid var(--line); padding-top: 28px; }
  .admin h2 { font-size: 24px; font-weight: 500; }
  .admin .hint { margin-top: 8px; max-width: 60ch; }
  .scroll { overflow-x: auto; margin-top: 18px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  tr:last-child td { border-bottom: 0; }
  td.pw { font-family: var(--font-mono); overflow-wrap: anywhere; }
  .btn.small { padding: 4px 10px; font-size: 14px; }

  @media (max-width: 760px) {
    .gate { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .card { transition: border-color 0.2s; }
    .card:focus-within { border-color: var(--accent); }
  }
</style>
</head>
<body>
<div class="gate" id="gate">
  <div>
    <p class="eyebrow">Private</p>
    <h1>Back Room</h1>
    <p class="sub">Sign in, or create an account with the access code you were given.</p>
  </div>
  <div class="card">
    <div class="tabs" role="tablist">
      <button type="button" class="tab" id="tab-in" role="tab" aria-selected="true" aria-controls="login">Sign in</button>
      <button type="button" class="tab" id="tab-up" role="tab" aria-selected="false" aria-controls="signup">Create account</button>
    </div>

    <form id="login" autocomplete="on">
      <label for="in-user">USERNAME
        <input id="in-user" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label for="in-pass">PASSWORD
        <input id="in-pass" name="password" type="password" autocomplete="current-password" required>
      </label>
      <div class="error" id="in-err" role="alert" aria-live="polite"></div>
      <button class="btn" id="in-go" type="submit">Sign in</button>
    </form>

    <form id="signup" autocomplete="on" hidden>
      <label for="up-user">CHOOSE A USERNAME
        <input id="up-user" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="3" maxlength="24">
        <span class="hint">3 to 24 characters: letters, numbers, dot, dash, underscore.</span>
      </label>
      <label for="up-pass">CHOOSE A PASSWORD
        <input id="up-pass" name="new-password" type="password" autocomplete="new-password" required minlength="8" maxlength="100">
        <span class="hint">At least 8 characters.</span>
      </label>
      <label for="up-pass2">REPEAT PASSWORD
        <input id="up-pass2" name="new-password-2" type="password" autocomplete="new-password" required minlength="8">
      </label>
      <label for="up-code">ACCESS CODE
        <input id="up-code" name="access-code" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" required>
        <span class="hint">Ask whoever shared this page with you.</span>
      </label>
      <div class="error" id="up-err" role="alert" aria-live="polite"></div>
      <button class="btn" id="up-go" type="submit">Create account</button>
    </form>

    <p class="note" id="note" hidden></p>
  </div>
</div>
<div id="members" hidden></div>

  var enc = new TextEncoder(), dec = new TextDecoder();

  function $(id) { return document.getElementById(id); }
  function b64(u8) { var s = ""; for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
  function unb64(s) { var bin = atob(s), o = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) o[i] = bin.charCodeAt(i); return o; }

  async function derive(secret, salt, usages) {
    var m = await crypto.subtle.importKey("raw", enc.encode(secret), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: VAULT.iter, hash: "SHA-256" }, m, { name: "AES-GCM", length: 256 }, false, usages);
  }
  async function unwrap(w, secret) {
    var k = await derive(secret, unb64(w.salt), ["decrypt"]);
    return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(w.iv) }, k, unb64(w.data)));
  }
  async function wrap(raw, secret) {
    var salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    var k = await derive(secret, salt, ["encrypt"]);
    var ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, k, raw));
    return { salt: b64(salt), iv: b64(iv), data: b64(ct) };
  }
  async function openContent(raw) {
    var key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    return dec.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(VAULT.content.iv) }, key, unb64(VAULT.content.data)));
  }
  async function sealForOwner(text) {
    var key = await crypto.subtle.importKey("jwk", VAULT.ownerPub, { name: "RSA-OAEP", hash: "SHA-256" }, false, ["encrypt"]);
    return b64(new Uint8Array(await crypto.subtle.encrypt({ name: "RSA-OAEP" }, key, enc.encode(text))));

  function importPriv(jwk) {
    return crypto.subtle.importKey("jwk", jwk, { name: "RSA-OAEP", hash: "SHA-256" }, false, ["decrypt"]);
  }

  // Account storage: one row per account in the Supabase "accounts" table.
  async function api(method, path, body) {
    var res = await fetch(CFG.url + "/rest/v1/" + path, {
      method: method,
      headers: { apikey: CFG.key, Authorization: "Bearer " + CFG.key, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: body ? JSON.stringify(body) : undefined
    });
    if (!res.ok) { var e = new Error("http " + res.status); e.status = res.status; throw e; }
    return method === "GET" ? res.json() : null;
  }

  function showNote(text) { var n = $("note"); n.textContent = text; n.hidden = !text; }
  function pick(which) {
    var inn = which === "in";
    $("tab-in").setAttribute("aria-selected", inn);
    $("tab-up").setAttribute("aria-selected", !inn);
    $("login").hidden = !inn;
    $("signup").hidden = inn;
    $("in-err").textContent = ""; $("up-err").textContent = "";
  }
  $("tab-in").addEventListener("click", function () { pick("in"); });
  $("tab-up").addEventListener("click", function () { pick("up"); });

  function enter(raw, username, adminKey) {
    return openContent(raw).then(function (html) {
      $("members").innerHTML = html;
      var who = $("who"); if (who) who.textContent = username;
      $("gate").hidden = true;
      $("members").hidden = false;
      $("lock").addEventListener("click", leave);
      window.scrollTo(0, 0);
      if (adminKey) showAdmin(adminKey);
    });
  }
  function leave() {
    $("members").hidden = true; $("members").innerHTML = "";
    $("gate").hidden = false;
    ["in-pass", "up-pass", "up-pass2", "up-code"].forEach(function (id) { $(id).value = ""; });
    pick("in"); $("in-user").focus();
  }

  // Admin only: list accounts and decrypt a password on request. The decryption key only opens with the admin password.
  async function showAdmin(priv) {
    try {
      var rows = await api("GET", "accounts?select=username,pw,created_at&order=created_at.asc");
      var sec = document.createElement("section"); sec.className = "admin";
      var h = document.createElement("h2"); h.textContent = "Accounts";
      var p = document.createElement("p"); p.className = "hint";
      p.textContent = "Only the admin sees this section. Passwords are stored encrypted and are decrypted here, in your browser, when you press Show.";
      var box = document.createElement("div"); box.className = "scroll";
      var table = document.createElement("table");
      var head = table.createTHead().insertRow();
      ["Username", "Created", "Password"].forEach(function (x) { var th = document.createElement("th"); th.textContent = x; head.appendChild(th); });
      var body = table.createTBody();
      rows.forEach(function (a) {
        var tr = body.insertRow();
        tr.insertCell().textContent = a.username;
        tr.insertCell().textContent = a.created_at ? new Date(a.created_at).toLocaleDateString() : "";
        var cell = tr.insertCell(); cell.className = "pw";
        var btn = document.createElement("button");
        btn.type = "button"; btn.className = "btn ghost small"; btn.textContent = "Show";
        btn.addEventListener("click", async function () {
          if (btn.dataset.shown) { cell.textContent = ""; cell.appendChild(btn); btn.textContent = "Show"; delete btn.dataset.shown; return; }
          try {
            var plain = await crypto.subtle.decrypt({ name: "RSA-OAEP" }, priv, unb64(a.pw));
            cell.textContent = dec.decode(plain) + " ";
            btn.textContent = "Hide"; btn.dataset.shown = "1"; cell.appendChild(btn);
          } catch (x) { cell.textContent = "Couldn't decrypt"; }
        });
        cell.appendChild(btn);
      });
      box.appendChild(table);
      sec.appendChild(h); sec.appendChild(p); sec.appendChild(box);
      ($("admin-slot") || $("members")).appendChild(sec);
    } catch (x) { /* the admin list is optional */ }
  }

  var fails = 0;

  var USERNAME = /^[a-z0-9][a-z0-9._-]{2,23}$/;
  var OFFLINE = "Couldn't reach the account service. Check your connection and try again.";

  $("login").addEventListener("submit", async function (e) {
    e.preventDefault();
    var err = $("in-err"), go = $("in-go");
    err.textContent = ""; go.disabled = true;
    var u = $("in-user").value.trim().toLowerCase(), pw = $("in-pass").value;
    var rows;
    try { rows = await api("GET", "accounts?select=*&username=eq." + encodeURIComponent(u)); }
    catch (x) { err.textContent = OFFLINE; go.disabled = false; return; }

      go.disabled = false;

      $("in-pass").value = "";
      penalise(go);
